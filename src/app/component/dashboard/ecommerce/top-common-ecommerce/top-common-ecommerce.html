<div class="card total-sales">
  <div class="card-body">
    <div class="row">
      <div class="col-xl-8 xl-12 col-md-8 col-sm-12 col box-col-12">
        <div class="d-flex {{data()?.class}}">
          <span>
            <svg>
              <use
                attr.xlink:href="assets/svg/icon-sprite.svg#{{data()?.icon}}"
              ></use>
            </svg>
          </span>
          <div class="flex-shrink-0">
            <h4>{{data()?.price}}</h4>
            <h6>{{ data()?.title}}</h6>
            <div class="arrow-chart">
              <svg>
                <use
                  attr.xlink:href="assets/svg/icon-sprite.svg#{{data()?.arrowicon}}"
                ></use>
              </svg>
              <h5 class="font-{{data()?.color}}">{{ data()?.percentage}}</h5>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-4 col-md-4 col-4 p-0 ecommerce-chart">
        <div class="{{data()?.chartclass}}">
          <apx-chart
            [series]="$safeNavigationMigration(data()?.series)!"
            [chart]="$safeNavigationMigration(data()?.chart)!"
            [stroke]="$safeNavigationMigration(data()?.stroke)!"
            [states]="$safeNavigationMigration(data()?.states)!"
            [plotOptions]="$safeNavigationMigration(data()?.plotOptions)!"
            [dataLabels]="$safeNavigationMigration(data()?.dataLabels)!"
            [grid]="$safeNavigationMigration(data()?.grid)!"
            [yaxis]="$safeNavigationMigration(data()?.yaxis)!"
            [xaxis]="$safeNavigationMigration(data()?.xaxis)!"
            [legend]="$safeNavigationMigration(data()?.legend)!"
            [fill]="$safeNavigationMigration(data()?.fill)!"
            [tooltip]="$safeNavigationMigration(data()?.tooltip)!"
            [markers]="$safeNavigationMigration(data()?.markers)!"
          />
        </div>
      </div>
    </div>
  </div>
</div>

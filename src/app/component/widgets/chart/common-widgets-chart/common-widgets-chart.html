<div class="card o-hidden">
  <div class="chart-widget-top">
    <div class="row card-body pb-0 m-0">
      <div class="col-xl-9 col-lg-8 col-9 p-0">
        <h3 class="mb-2">{{ data()?.title }}</h3>
        <h4>{{ data()?.data}}</h4>
        <span>Compare to last month</span>
      </div>
      <div class="col-xl-3 col-lg-4 col-3 text-end p-0">
        <h6 class="txt-success">+65%</h6>
      </div>
    </div>
    <div>
      <div id="chart-widget1">
        <apx-chart
          [series]="$safeNavigationMigration(data()?.series)!"
          [chart]="$safeNavigationMigration(data()?.chart)!"
          [colors]="$safeNavigationMigration(data()?.colors)!"
          [plotOptions]="$safeNavigationMigration(data()?.plotOptions)!"
          [fill]="$safeNavigationMigration(data()?.fill)!"
          [dataLabels]="$safeNavigationMigration(data()?.dataLabels)!"
          [grid]="$safeNavigationMigration(data()?.grid)!"
          [stroke]="$safeNavigationMigration(data()?.stroke)!"
          [xaxis]="$safeNavigationMigration(data()?.xaxis)!"
          [yaxis]="$safeNavigationMigration(data()?.yaxis)!"
          [responsive]="$safeNavigationMigration(data()?.responsive)!"
          [markers]="$safeNavigationMigration(data()?.markers)!"
          [grid]="$safeNavigationMigration(data()?.grid)!"
        />
      </div>
    </div>
  </div>
</div>
